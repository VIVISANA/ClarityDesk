services:
  - type: web
    name: claritydesk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CLARITYDESK_DATA_DIR
        value: /tmp/claritydesk-data
      - key: APP_ORIGINS
        sync: false
      - key: OLLAMA_BASE_URL
        value: ""
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
